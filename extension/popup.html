<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; width: 280px; padding: 16px; color: #1a1a1a; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { margin: 0 0 12px; color: #666; font-size: 12px; line-height: 1.4; }
      .status { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 12px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; flex: none; }
      .dot.ok { background: #128a3a; }
      .dot.bad { background: #b00020; }
      button { width: 100%; padding: 10px; background: #128a3a; color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>Flip-ly Free Finds</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="statusText">Checking…</span></div>
    <p>Open a Facebook group, scroll to the posts you want, then click <b>Send free finds</b> on the page.</p>
    <button id="openSettings">Open settings</button>
    <script src="popup.js"></script>
  </body>
</html>
