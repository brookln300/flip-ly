<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px -apple-system, system-ui, sans-serif; width: 300px; padding: 14px; color: #1a1a1a; }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p.sub { margin: 0 0 12px; color: #666; font-size: 12px; }
      label { display: block; margin: 10px 0 4px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 7px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
      button { margin-top: 14px; width: 100%; padding: 9px; background: #128a3a; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
      #status { margin-top: 10px; font-size: 12px; color: #128a3a; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>Flip-ly Free Finds</h1>
    <p class="sub">Open a Facebook group, scroll to the posts you want, then click "Send free finds" on the page.</p>

    <label for="endpoint">Ingest endpoint URL</label>
    <input id="endpoint" type="url" placeholder="https://your-app.vercel.app/api/ingest/fb-post" />

    <label for="token">Ingest token</label>
    <input id="token" type="password" placeholder="FB_INGEST_TOKEN value" />

    <button id="save">Save</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
